name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matlab-tests:
    name: MATLAB tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: Signal_Processing_Toolbox

      - name: Run MATLAB unit tests
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('Code'); results = runtests('tests'); assertSuccess(results);

  python-tests:
    name: Python multi-device tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: python -m pip install pytest -r Code/wild_preprocess/requirements.txt

      - name: Run Python regression suite
        run: python -m pytest tests -q
