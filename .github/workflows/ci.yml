name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matlab-tests:
    name: MATLAB tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: Signal_Processing_Toolbox

      - name: Run MATLAB unit tests
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('Code'); results = runtests('tests'); assertSuccess(results);

  python-smoke:
    name: Python syntax smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Compile Python entry points
        run: python -m py_compile Code/WILD_generate_pc_time.py Code/WILD_preprocess_gui/wild_preprocess_gui.py
